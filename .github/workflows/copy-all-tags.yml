name: Mirror all Docker tags

on:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Install Skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo jq curl

      - name: Log in to Docker Hub
        run: |
          skopeo login docker.io \
            --username "${{ secrets.DOCKERHUB_USERNAME }}" \
            --password "${{ secrets.DOCKERHUB_TOKEN }}"

      - name: Mirror all tags
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="docker://reignz3/wzml"
          TARGET="docker://docker.io/${{ secrets.DOCKERHUB_USERNAME }}/rhkwz"
          SOURCE_REPO="reignz3/wzml"
          TARGET_REPO="${{ secrets.DOCKERHUB_USERNAME }}/rhkwz"

          URL="https://hub.docker.com/v2/repositories/mysterysd/wzmlx/tags/?page_size=100"
          SOURCE="docker://${SOURCE_REPO}"
          TARGET="docker://docker.io/${TARGET_REPO}"

          URL="https://hub.docker.com/v2/repositories/${SOURCE_REPO}/tags/?page_size=100"

          COUNT=0

          while [ -n "$URL" ] && [ "$URL" != "null" ]; do

            echo "Fetching tags..."
            echo "Fetching tags from ${SOURCE_REPO}..."
            RESPONSE=$(curl -fsSL "$URL")

            TAGS=$(echo "$RESPONSE" | jq -r '.results[].name')

            while IFS= read -r TAG; do
              [ -z "$TAG" ] && continue

              echo ""
              echo "=========================================="
              echo "Mirroring tag: $TAG"
              echo "=========================================="

              skopeo copy \
              if skopeo copy \
                --all \
                "${SOURCE}:${TAG}" \
                "${TARGET}:${TAG}"
                "${TARGET}:${TAG}"; then

                COUNT=$((COUNT + 1))
                echo "Successfully mirrored: ${TAG}"

              else

                echo "WARNING: Failed to mirror tag: ${TAG}"
                echo "Skipping..."

              COUNT=$((COUNT + 1))
              fi

            done <<< "$TAGS"

            URL=$(echo "$RESPONSE" | jq -r '.next')

          done

          echo ""
          echo "=========================================="
          echo "Mirror completed."
          echo "Tags copied: $COUNT"
          echo "=========================================="
